<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Feedbeat Collector</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        --card: #f4f4f5;
        --accent: #7c3aed;
        --warn: #b45309;
        --bad: #dc2626;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #18181b; --fg: #fafafa; --muted: #a1a1aa; --line: #3f3f46; --card: #27272a; --accent: #a78bfa; --warn: #fbbf24; --bad: #f87171; }
      }
      * { box-sizing: border-box; }
      body { font: 13px/1.45 system-ui, -apple-system, sans-serif; width: 300px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
      header { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
      header img { width: 22px; height: 22px; }
      #who { margin-left: auto; font-weight: 500; color: var(--muted); }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
      .stat { background: var(--card); border-radius: 10px; padding: 8px 10px; }
      .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
      .stat span { color: var(--muted); font-size: 12px; }
      #status { margin: 10px 0 0; color: var(--muted); min-height: 1.45em; }
      #status.warn { color: var(--warn); }
      #status.bad { color: var(--bad); }
      .actions { display: grid; gap: 6px; margin-top: 12px; }
      button { font: inherit; width: 100%; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; cursor: pointer; }
      button.primary { border: 0; background: var(--accent); color: #fff; }
      button:disabled { opacity: 0.55; cursor: default; }
      button[hidden] { display: none; }
      .link { border: 0; padding: 4px; color: var(--muted); font-weight: 500; font-size: 12px; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon32.png" alt="" /> Feedbeat <span id="who"></span></header>
    <div class="stats">
      <div class="stat"><b id="songs">0</b><span>songs found</span></div>
      <div class="stat"><b id="posts">0</b><span>posts read</span></div>
    </div>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <div class="actions">
      <button id="start" class="primary">Start scanning my posts</button>
      <button id="pause" hidden>Pause</button>
      <button id="new" hidden>Check for new posts</button>
      <button id="site">Open Feedbeat to publish</button>
      <button id="reset" class="link" hidden>Start over</button>
    </div>
    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
