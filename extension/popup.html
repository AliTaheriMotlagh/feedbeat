<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Feedbeat Collector</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; }
      button { width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #7c3aed; color: #fff; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      p { margin: 10px 0 0; color: #555; }
    </style>
  </head>
  <body>
    <button id="go">Collect my music links</button>
    <p id="status">Open your own X profile, then click. Keep the tab open while it scrolls.</p>
    <script src="popup.js"></script>
  </body>
</html>
